# --------------------
# Bluetooth & Wireless
# --------------------
# ZMK handles CONFIG_BT and PERIPHERAL roles automatically 
# based on the shield side. Don't force them manually.
CONFIG_ZMK_BLE=y
# Increase power to help the signal get through the keyboard case
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
# --------------------
# Split Keyboard
# --------------------
CONFIG_ZMK_SPLIT=y
# --------------------
# Enables RGB functionality (Uncomment lines below to enable.)
# --------------------
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_WS2812_STRIP=y

CONFIG_ZMK_EXT_POWER=y

CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_ZMK_RGB_UNDERGLOW_EFFECT_STATIC=y
CONFIG_ZMK_RGB_UNDERGLOW_BRT=100
CONFIG_ZMK_RGB_UNDERGLOW_SAT=100
CONFIG_ZMK_RGB_UNDERGLOW_HUE=300